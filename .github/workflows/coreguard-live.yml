name: CoreGuard live numbers
on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-brand.py
      - run: |
          git config user.name "coreguard-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets/brand README.md INVEST.md PROJECTS.md
          git diff --cached --quiet || (git commit -m "⚡ Sync live CoreGuard numbers" && git push)
