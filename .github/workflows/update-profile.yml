name: update-profile-assets

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/generate-arsenal.js", "profile-data/evidence.json"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Arsenal assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESLAMX_USER: EslaM-X
        run: node scripts/generate-arsenal.js

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No asset changes — nothing to commit"
          else
            git commit -m "build: refresh profile arsenal telemetry assets"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/EslaM-X/EslaM-X.git" main
          fi
        env:
          PUSH_TOKEN: ${{ secrets.PROFILE_PUSH_TOKEN }}
